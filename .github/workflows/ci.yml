name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install project Rust toolchain
        run: rustup show

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run and audit the focused CPU test partition
        # The ordinary cargo test above is mandatory: --all-features selects
        # the focused partition and is not a substitute for the default suite.
        run: |
          cargo test --locked --lib -- --list > "$RUNNER_TEMP/all-tests.txt"
          cargo test --locked --lib --features focused-retopology -- --list > "$RUNNER_TEMP/focused-tests.txt"
          python3 scripts/check-test-partitions.py "$RUNNER_TEMP/all-tests.txt" "$RUNNER_TEMP/focused-tests.txt"
          cargo test --locked --lib --features focused-retopology -- --test-threads=1

      - name: Check GPU selection audit
        run: python3 scripts/test-gpu-ci.py

      - name: Check capacity benchmark comparisons
        run: python3 scripts/test-benchmark-capacity.py

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check experimental native retopology solver
        run: |
          cargo fmt --manifest-path crates/clay-retopology/Cargo.toml --check
          cargo test --locked --manifest-path crates/clay-retopology/Cargo.toml --all-features --lib -- --test-threads=1
          cargo clippy --locked --manifest-path crates/clay-retopology/Cargo.toml --all-features --all-targets -- -D warnings

      - name: Retain replayable invariant failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-invariant-replays
          path: target/invariant-failures/
          if-no-files-found: ignore

  graphics-tests:
    name: GPU / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [core, interactions-a, interactions-b]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAY_GPU_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
      LP_NUM_THREADS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install project Rust toolchain
        run: rustup show

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Install build and Mesa runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers

      - name: Run and time audited GPU checks
        run: python3 scripts/run-gpu-ci.py '${{ matrix.group }}'

      - name: Retain GPU timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-timings-${{ matrix.group }}
          path: ${{ runner.temp }}/gpu-review/timings-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain path and Integer grid control review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editable-path-ring-controls-${{ matrix.group }}
          path: |
            /tmp/clay-ring-editable-panel.png
            /tmp/clay-automatic-path-settings.png
            ${{ runner.temp }}/gpu-review/native_retopology_controls_offscreen_review/integer-grid-controls.png
            ${{ runner.temp }}/gpu-review/native_retopology_controls_offscreen_review/selected-guides-before-preview.png
            ${{ runner.temp }}/gpu-review/native_retopology_controls_offscreen_review/native-preview.png
          if-no-files-found: ignore
          retention-days: 7

  graphics:
    # Preserve the existing required check name; every shard must succeed.
    name: Headless wgpu/Vulkan regressions
    needs: graphics-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all GPU groups
        env:
          GPU_RESULT: ${{ needs.graphics-tests.result }}
        run: test "$GPU_RESULT" = success
